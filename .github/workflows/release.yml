name: Build Android app and publish release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install tools
        run: npm install

      - name: Set the dashboard address
        run: node scripts/prepare.mjs www
        env:
          ADMIN_URL: ${{ vars.ADMIN_URL }}

      - name: Create the Android project
        run: npx cap add android

      - name: Generate icons and splash screen
        run: |
          mkdir -p assets
          cp branding/* assets/
          npx capacitor-assets generate --android \
            --iconBackgroundColor '#18130E' --iconBackgroundColorDark '#18130E' \
            --splashBackgroundColor '#18130E' --splashBackgroundColorDark '#18130E'

      - name: Sync web files
        run: npx cap sync android

      - name: Hide the "View website" link inside the app
        run: |
          ORIGIN=$(node -e "const c=require('./capacitor.config.json');console.log('https://'+c.server.allowNavigation[0])")
          mkdir -p android/app/src/main/assets android/app/src/main/java/ng/enactus/admin
          cp inject.js android/app/src/main/assets/inject.js
          sed "s#__ORIGIN__#$ORIGIN#" android-patch/MainActivity.java > android/app/src/main/java/ng/enactus/admin/MainActivity.java
          sed -i '0,/^dependencies {/s//dependencies {\n    implementation "androidx.webkit:webkit:1.12.1"/' android/app/build.gradle
          grep -q "androidx.webkit" android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          UNSIGNED=$(find android/app/build/outputs/apk/release -name '*.apk' | head -n 1)
          mkdir -p out
          "$APKSIGNER" sign --ks signing/enactus.keystore --ks-key-alias enactus \
            --ks-pass pass:enactusng2026 --key-pass pass:enactusng2026 \
            --out out/EnactusNG.apk "$UNSIGNED"
          "$APKSIGNER" verify out/EnactusNG.apk
          ls -la out

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Enactus NG – Android app
          - **EnactusNG.apk** – install on any Android 6+ phone (allow "Install unknown apps" for your browser when asked).
          NOTES
          gh release create "v1.0.${{ github.run_number }}" out/EnactusNG.apk \
            --repo "${{ github.repository }}" \
            --title "Enactus NG Android v1.0.${{ github.run_number }}" \
            --notes-file notes.md
